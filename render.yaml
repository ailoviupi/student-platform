services:
  - type: web
    name: student-platform-backend
    env: docker
    plan: free
    rootDir: backend
    healthCheckPath: /api/actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 8888
      - key: SPRING_DATASOURCE_URL
        sync: false
        value: jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/snvec_student_platform?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
        value: fDqMarNRMypfEJb.root
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
        value: kUjjc9sM6IrXgfm3
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
        value: https://student-platform.vercel.app
