services:
  - type: web
    name: student-platform-backend
    env: java
    plan: free
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -Dserver.port=$PORT -Dspring.profiles.active=prod -jar target/student-platform-1.0.0.jar
    healthCheckPath: /api/actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 8888
      - key: SPRING_DATASOURCE_URL
        sync: false
        value: jdbc:mysql://xxxxxx.tidbcloud.com:4000/snvec_student_platform?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
        value: root
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
        value: root
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
        value: https://your-vercel-app.vercel.app
