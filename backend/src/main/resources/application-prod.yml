# ============================================================
# 生产环境配置 (Render 部署)
# 通过 SPRING_PROFILES_ACTIVE=prod 激活
# ============================================================

server:
  port: ${SERVER_PORT:8888}
  servlet:
    context-path: /api

spring:
  # 禁用不需要的自动配置（免费层无 Redis/RabbitMQ）
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  
  # 数据源 - 从环境变量读取 (TiDB Cloud)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:4000/snvec_student_platform?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 600000
  
  # 关闭缓存（无 Redis）
  cache:
    type: simple
  
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.snvec.student.modules.*.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT - 从环境变量读取密钥
jwt:
  secret: ${JWT_SECRET:snvec-student-platform-secret-key-2024-suining-engineering-vocational-college}
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

# 日志
logging:
  level:
    com.snvec.student: info
    org.springframework.security: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 自定义配置
app:
  upload-path: /tmp/uploads/
  rate-limit:
    normal: 100
    batch: 10
